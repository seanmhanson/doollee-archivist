name: Unit Tests

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup-node-env

      - name: Run Unit Tests
        env:
          MONGO_URI: mongodb://test:10000
        run: yarn test --coverage --ci --json --outputFile=test-results.json

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results.json
          retention-days: 14
